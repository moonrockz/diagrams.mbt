name: Setup toolchain
description: Install mise, the tools pinned in .config/mise/config.toml, and the complete MoonBit toolchain.

inputs:
  github-token:
    description: Token for mise to query GitHub releases without rate limits.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install mise and pinned tools
      if: runner.os != 'Windows'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        MISE_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        curl -fsSL https://mise.run | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
        export PATH="$HOME/.local/bin:$PATH"
        mise --version
        mise trust
        mise install

    # mise.run has no Windows installer, so Windows uses the mise action.
    - name: Install mise and pinned tools (Windows)
      if: runner.os == 'Windows'
      uses: jdx/mise-action@v5
      with:
        github_token: ${{ inputs.github-token }}
        cache: false

    # The postinstall hook of http:moonbit (.config/mise/config.toml) completes the toolchain with
    # the core library and moonx during `mise install`. These steps only put it on PATH.
    - name: Use the MoonBit toolchain
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        export PATH="$HOME/.local/bin:$PATH"
        moonbit_dir="$(mise where http:moonbit)"
        test -f "$moonbit_dir/lib/core/moon.mod" || { echo "::error::The MoonBit core is missing"; exit 1; }
        echo "$moonbit_dir/bin" >> "$GITHUB_PATH"
        echo "MOON_HOME=$moonbit_dir" >> "$GITHUB_ENV"

    - name: Use the MoonBit toolchain (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $moonbitDir = mise where http:moonbit
        if (-not (Test-Path (Join-Path $moonbitDir 'lib/core/moon.mod') -PathType Leaf)) { throw 'The MoonBit core is missing' }
        if (-not (Test-Path (Join-Path $moonbitDir 'bin/moonx.exe') -PathType Leaf)) { throw 'moonx is missing' }
        "$moonbitDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        "MOON_HOME=$moonbitDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Report versions and update the registry
      shell: bash
      run: |
        set -euo pipefail
        moon version --all
        moon update
