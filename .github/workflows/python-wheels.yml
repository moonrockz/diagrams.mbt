name: Python wheels

# Builds the diagrams.mbt Python wheels for every platform on one Linux runner with zig, then
# installs and tests each wheel on a native runner (openspec publish-python-package, CI-1). CI and
# Release call this workflow. It gives the tested wheels and the oracle results to the caller as
# the artifact `python-dist`. It publishes nothing: the PyPI upload must run in release.yml, the
# workflow of the trusted publisher.
on:
  workflow_call:

permissions:
  contents: read

env:
  MISE_EXPERIMENTAL: 'true'

jobs:
  build:
    name: Build wheels (zig)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install pinned tools
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # The archives have pinned SHA-256 digests; the build checks them again after a cache hit.
      - name: Cache pinned header and mimalloc archives
        uses: actions/cache@v4
        with:
          path: _build/python-native/downloads
          key: python-wheels-downloads-${{ hashFiles('scripts/python-wheels.mbtx') }}
      - name: Cross-build the wheels
        run: mise run python-native:wheels
      - name: Check the wheel metadata
        run: |
          python3 -m venv "$RUNNER_TEMP/twine"
          "$RUNNER_TEMP/twine/bin/pip" install --quiet twine==7.0.0
          "$RUNNER_TEMP/twine/bin/twine" check --strict _build/python-native/dist/*.whl
      - name: Upload the wheels and oracle results
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: |
            _build/python-native/dist
            _build/python-native/oracle
          if-no-files-found: error
          retention-days: 14

  test:
    name: Test wheel (${{ matrix.os }}, ${{ matrix.python }})
    needs: [build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
        python: ['3.12', '3.15']
    steps:
      - name: Checkout the tests and fixtures
        uses: actions/checkout@v6
      - name: Set up CPython ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Download the wheels
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: ${{ runner.temp }}/python-dist
      - name: Install the wheel for this platform from the built files only
        shell: bash
        run: python -m pip install --no-index --find-links "${{ runner.temp }}/python-dist/dist" diagrams.mbt
      # The tests run outside the checkout, so they import the installed package.
      - name: Run the tests
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          DIAGRAMS_NATIVE_FIXTURES: ${{ github.workspace }}/apps/python-native/fixtures
          DIAGRAMS_NATIVE_ORACLE: ${{ runner.temp }}/python-dist/oracle
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          tests="${{ github.workspace }}/apps/python-native/python/tests"
          python -m unittest discover -v -s "$tests" -t "$tests"
      - name: Check the manylinux tag
        if: runner.os == 'Linux' && matrix.python == '3.12'
        shell: bash
        run: |
          python -m pip install --quiet auditwheel==6.8.2
          auditwheel show "${{ runner.temp }}"/python-dist/dist/*"$(uname -m)".whl
