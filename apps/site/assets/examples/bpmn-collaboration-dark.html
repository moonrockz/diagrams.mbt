[data-diagram-viewer] [hidden] { display: none !important; }
[data-diagram-viewer] label { display: inline-flex; align-items: center; gap: .35rem; }
[data-diagram-viewer] select { max-width: 20rem; }
[data-diagram-viewer] [data-control="seek"] { width: min(22rem, 60vw); }
[data-diagram-viewer] :focus-visible { outline: 3px solid #2563eb; outline-offset: 3px; }
[data-diagram-viewer] [data-control="status"] { min-height: 1.5em; }
[data-diagram-viewer] .motion-overlay { pointer-events: none; }
@media screen {
  [data-diagram-viewer] .motion-selected { filter: drop-shadow(0 0 3px #2563eb); }
  [data-diagram-viewer] .motion-selected:is(.swimlane-connection, .flowchart-connection, .architecture-connection) { filter: none; }

  [data-diagram-viewer] .motion-visit { filter: drop-shadow(0 0 4px #2563eb) drop-shadow(0 0 2px #2563eb); }
}
@media (prefers-color-scheme: dark) {
  body { background: #10131a; color: #e2e8f0; }
  [data-diagram-viewer] { --viewer-bg: #10131a; --viewer-ink: #e2e8f0; --viewer-border: #94a3b8; }
}
@media print {

  [data-diagram-viewer] .diagram-canvas { overflow: visible; border: none; }
}
[data-diagram-viewer] .motion-controls output { min-width: 24ch; font-variant-numeric: tabular-nums; }
