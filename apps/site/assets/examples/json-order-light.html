<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Diagram flow illustration</title><style>body { margin: 1.5rem; background: #f4f5f7; color: #0f172a; font: 15px/1.5 system-ui, sans-serif; }
[data-diagram-viewer] { --viewer-bg: #f4f5f7; --viewer-ink: #0f172a; --viewer-border: #64748b; max-width: 90rem; margin: auto; }
[data-diagram-viewer] .diagram-canvas { overflow: auto; border: 1px solid var(--viewer-border); border-radius: .4rem; }
[data-diagram-viewer] .diagram-canvas > svg { display: block; max-width: 100%; height: auto; }
[data-diagram-viewer] .motion-controls, [data-diagram-viewer] fieldset { display: flex; align-items: center; flex-wrap: wrap; gap: .6rem; margin: .8rem 0; }
[data-diagram-viewer] fieldset { border: 1px solid var(--viewer-border); border-radius: .4rem; }
[data-diagram-viewer] button, [data-diagram-viewer] select, [data-diagram-viewer] input { font: inherit; }
[data-diagram-viewer] button, [data-diagram-viewer] select { padding: .35rem .6rem; border: 1px solid var(--viewer-border); border-radius: .3rem; background: var(--viewer-bg); color: var(--viewer-ink); }
[data-diagram-viewer] [hidden] { display: none !important; }
[data-diagram-viewer] label { display: inline-flex; align-items: center; gap: .35rem; }
[data-diagram-viewer] select { max-width: 20rem; }
[data-diagram-viewer] [data-control="seek"] { width: min(22rem, 60vw); }
[data-diagram-viewer] :focus-visible { outline: 3px solid #2563eb; outline-offset: 3px; }
[data-diagram-viewer] [data-control="status"] { min-height: 1.5em; }
[data-diagram-viewer] .motion-overlay { pointer-events: none; }
@media screen {
  [data-diagram-viewer] .motion-selected { filter: drop-shadow(0 0 3px #2563eb); }
  [data-diagram-viewer] .motion-visit { filter: drop-shadow(0 0 4px #2563eb) drop-shadow(0 0 2px #2563eb); }
}
@media (prefers-color-scheme: dark) {
  body { background: #10131a; color: #e2e8f0; }
  [data-diagram-viewer] { --viewer-bg: #10131a; --viewer-ink: #e2e8f0; --viewer-border: #94a3b8; }
}
@media print {
  body { margin: 0; background: white; }
  [data-diagram-viewer] .motion-controls, [data-diagram-viewer] fieldset, [data-diagram-viewer] [data-control="status"], [data-diagram-viewer] .motion-overlay { display: none !important; }
  [data-diagram-viewer] .motion-visit, [data-diagram-viewer] .motion-selected { filter: none !important; }
  [data-diagram-viewer] .diagram-canvas { overflow: visible; border: none; }
}

<p>Illustrative hierarchy. Rows and boxes are visited in order; values are not evaluated.</p>

<button type="button" data-control="play" aria-pressed="false">Play</button>

<label>Position <input data-control="seek" aria-label="Playback position" type="range" min="0" max="29000" value="0" step="1"></label>
<output data-control="position">0 / 29000 ms</output>
<button type="button" data-control="download">Download SVG</button>
</section>
<fieldset><legend>Structural exploration</legend>
<label>From <select data-control="from" aria-label="Route from"></select></label>

<label><input data-control="messages" type="checkbox">Include message flows</label>
<label><input data-control="undirected" type="checkbox">Include unheaded connections</label>
<button type="button" data-control="route">Show route</button>
<label>Connection <select data-control="connection" aria-label="Select a swimlane connection"></select></label>
<button type="button" data-control="show-connection">Show connection</button>
<label>Direction <select data-control="direction" aria-label="Reachability direction"><option value="forward">Downstream</option><option value="reverse">Upstream</option><option value="both">Both directions</option></select></label>
<button type="button" data-control="reach">Show reachability</button>
