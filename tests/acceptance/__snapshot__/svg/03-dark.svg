      <rect class="box" x="295" y="24" width="96" height="48" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
      <text class="p-label" x="343" y="52" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#ffffff">
        <tspan x="343" y="52">Web app</tspan>
      </text>
    </g>
    <g class="participant f-backend" data-id="API">
