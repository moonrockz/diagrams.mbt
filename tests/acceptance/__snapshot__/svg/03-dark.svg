      <text class="p-label" x="496" y="52" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#ffffff">
        <tspan x="496" y="52">API gateway</tspan>
      </text>
    </g>
    <g class="participant f-database" data-id="Bank">
