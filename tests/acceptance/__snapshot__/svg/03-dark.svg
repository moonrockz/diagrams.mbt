<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 753 491" width="753" height="491" role="img" data-diagram="sequence">
  <title>Sequence diagram</title>
  <desc>Sequence diagram with 4 participants (Customer, Web, API, Bank) and 6 messages.</desc>
  <defs>
