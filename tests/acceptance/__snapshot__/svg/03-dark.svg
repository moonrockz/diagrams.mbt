      <rect class="mask" x="145" y="340" width="132" height="23" rx="3" fill="#0f172a"/>
      <text class="m-label" x="211" y="355" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#94a3b8">
        <tspan x="211" y="355">6 Order confirmed</tspan>
      </text>
