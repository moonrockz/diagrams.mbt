    <path class="lifeline" d="M496 72 V459" fill="none" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3 7"/>
    <path class="lifeline" d="M673 72 V459" fill="none" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3 7"/>
