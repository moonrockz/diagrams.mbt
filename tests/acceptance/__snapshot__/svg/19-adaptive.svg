<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 371 240" width="371" height="240" role="img" data-diagram="sequence">
  <title>Sequence diagram</title>
  <desc>Sequence diagram with 2 participants (Alice, John) and 2 messages.</desc>
  <defs>
