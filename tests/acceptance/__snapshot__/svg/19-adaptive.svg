    <marker id="head-0-end" viewBox="-10 -5 15 10" refX="0" refY="0" markerWidth="15" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M-9,-4 L0,0 L-9,4 z" fill="var(--frontend-stroke)" stroke="var(--frontend-stroke)" stroke-width="1.4"/>
    </marker>
    <marker id="head-1-end" viewBox="-10 -5 15 10" refX="0" refY="0" markerWidth="15" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M-9,-4 L0,0 L-9,4 z" fill="var(--arrow)" stroke="var(--arrow)" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="371" height="240" rx="0" fill="var(--bg)"/>
  <g class="bands"/>
  <g class="lifelines">
    <path class="lifeline" d="M80 72 V208" fill="none" stroke="var(--arrow)" stroke-width="0.8" stroke-dasharray="3 7"/>
    <path class="lifeline" d="M291 72 V208" fill="none" stroke="var(--arrow)" stroke-width="0.8" stroke-dasharray="3 7"/>
  </g>
  <g class="activations">
    <rect class="activation-mask" x="286" y="127" width="10" height="48" rx="0" fill="var(--mask)"/>
    <rect class="activation" x="286" y="127" width="10" height="48" rx="0" fill="var(--backend-fill)" stroke="var(--backend-stroke)" stroke-width="1.5"/>
  </g>
  <g class="messages">
    <g class="message f-frontend" data-index="0" data-from="Alice" data-to="John" data-sender-head="none" data-receiver-head="arrow">
      <path class="m-line" d="M87 127 L284 127" fill="none" stroke="var(--frontend-stroke)" stroke-width="1.4" marker-end="url(#head-0-end)"/>
      <rect class="mask" x="96" y="100" width="179" height="23" rx="3" fill="var(--mask)"/>
      <text class="m-label" x="185" y="115" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="var(--frontend-ink)">
        <tspan x="185" y="115">Hello John, how are you?</tspan>
      </text>
    </g>
    <g class="message f-external" data-index="1" data-from="John" data-to="Alice" data-sender-head="none" data-receiver-head="arrow">
      <path class="m-line" d="M286 175 L87 175" fill="none" stroke="var(--arrow)" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#head-1-end)"/>
      <rect class="mask" x="157" y="148" width="57" height="23" rx="3" fill="var(--mask)"/>
      <text class="m-label" x="185" y="163" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="var(--external-ink)">
        <tspan x="185" y="163">Great!</tspan>
      </text>
    </g>
  </g>
  <g class="notes"/>
  <g class="participants">
    <g class="participant f-frontend" data-id="Alice">
      <rect class="mask" x="32" y="24" width="96" height="48" rx="6" fill="var(--mask)"/>
      <rect class="box" x="32" y="24" width="96" height="48" rx="6" fill="var(--frontend-fill)" stroke="var(--frontend-stroke)" stroke-width="1.5"/>
      <text class="p-label" x="80" y="52" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="var(--text)">
        <tspan x="80" y="52">Alice</tspan>
