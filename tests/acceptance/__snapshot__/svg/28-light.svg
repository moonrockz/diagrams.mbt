<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 474" width="480" height="474" role="img" data-diagram="sequence">
  <title>Sequence diagram</title>
  <desc>Sequence diagram with 3 participants (Alice, Bob, John) and 4 messages.</desc>
  <defs>
    <marker id="head-0-end" viewBox="-10 -5 15 10" refX="0" refY="0" markerWidth="15" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M-9,-4 L0,0 L-9,4 z" fill="#0891b2" stroke="#0891b2" stroke-width="1.4"/>
    </marker>
    <marker id="head-1-end" viewBox="-10 -5 15 10" refX="0" refY="0" markerWidth="15" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M-9,-4 L0,0 L-9,4 z" fill="#0891b2" stroke="#0891b2" stroke-width="1.4"/>
    </marker>
    <marker id="head-2-end" viewBox="-10 -5 15 10" refX="0" refY="0" markerWidth="15" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M-9,-4 L0,0 L-9,4 z" fill="#64748b" stroke="#64748b" stroke-width="1.4"/>
    </marker>
    <marker id="head-3-end" viewBox="-10 -5 15 10" refX="0" refY="0" markerWidth="15" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M-9,-4 L0,0 L-9,4 z" fill="#64748b" stroke="#64748b" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="480" height="474" rx="0" fill="#f4f5f7"/>
  <g class="bands">
    <rect class="band-mask" x="32" y="100" width="416" height="218" rx="6" fill="#f4f5f7"/>
    <rect class="frame" x="32" y="100" width="416" height="218" rx="6" fill="rgba(148, 163, 184, 0.18)" stroke="#64748b" stroke-width="1.5"/>
  </g>
  <g class="lifelines">
    <path class="lifeline" d="M96 72 V442" fill="none" stroke="#64748b" stroke-width="0.8" stroke-dasharray="3 7"/>
    <path class="lifeline" d="M240 72 V442" fill="none" stroke="#64748b" stroke-width="0.8" stroke-dasharray="3 7"/>
    <path class="lifeline" d="M384 72 V442" fill="none" stroke="#64748b" stroke-width="0.8" stroke-dasharray="3 7"/>
  </g>
  <g class="activations"/>
  <g class="messages">
    <g class="message f-frontend" data-index="0" data-from="Alice" data-to="Bob" data-sender-head="none" data-receiver-head="arrow">
      <path class="m-line" d="M103 170 L233 170" fill="none" stroke="#0891b2" stroke-width="1.4" marker-end="url(#head-0-end)"/>
      <rect class="mask" x="123" y="143" width="91" height="23" rx="3" fill="#ffffff"/>
      <text class="m-label" x="168" y="158" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#077995">
        <tspan x="168" y="158">Hello guys!</tspan>
      </text>
    </g>
    <g class="message f-frontend" data-index="1" data-from="Alice" data-to="John" data-sender-head="none" data-receiver-head="arrow">
      <path class="m-line" d="M103 277 L377 277" fill="none" stroke="#0891b2" stroke-width="1.4" marker-end="url(#head-1-end)"/>
      <rect class="mask" x="195" y="250" width="91" height="23" rx="3" fill="#ffffff"/>
      <text class="m-label" x="240" y="265" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#077995">
        <tspan x="240" y="265">Hello guys!</tspan>
      </text>
    </g>
    <g class="message f-external" data-index="2" data-from="Bob" data-to="Alice" data-sender-head="none" data-receiver-head="arrow">
      <path class="m-line" d="M233 361 L103 361" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#head-2-end)"/>
      <rect class="mask" x="130" y="334" width="77" height="23" rx="3" fill="#ffffff"/>
      <text class="m-label" x="168" y="349" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#606f85">
        <tspan x="168" y="349">Hi Alice!</tspan>
      </text>
    </g>
    <g class="message f-external" data-index="3" data-from="John" data-to="Alice" data-sender-head="none" data-receiver-head="arrow">
      <path class="m-line" d="M377 409 L103 409" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#head-3-end)"/>
      <rect class="mask" x="202" y="382" width="77" height="23" rx="3" fill="#ffffff"/>
      <text class="m-label" x="240" y="397" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#606f85">
        <tspan x="240" y="397">Hi Alice!</tspan>
      </text>
    </g>
  </g>
  <g class="notes"/>
  <g class="participants">
    <g class="participant f-frontend" data-id="Alice">
      <rect class="mask" x="48" y="24" width="96" height="48" rx="6" fill="#ffffff"/>
      <rect class="box" x="48" y="24" width="96" height="48" rx="6" fill="rgba(34, 211, 238, 0.15)" stroke="#0891b2" stroke-width="1.5"/>
      <text class="p-label" x="96" y="52" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#111827">
        <tspan x="96" y="52">Alice</tspan>
      </text>
    </g>
    <g class="participant f-backend" data-id="Bob">
      <rect class="mask" x="192" y="24" width="96" height="48" rx="6" fill="#ffffff"/>
      <rect class="box" x="192" y="24" width="96" height="48" rx="6" fill="rgba(52, 211, 153, 0.18)" stroke="#059669" stroke-width="1.5"/>
      <text class="p-label" x="240" y="52" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#111827">
        <tspan x="240" y="52">Bob</tspan>
      </text>
    </g>
    <g class="participant f-database" data-id="John">
      <rect class="mask" x="336" y="24" width="96" height="48" rx="6" fill="#ffffff"/>
      <rect class="box" x="336" y="24" width="96" height="48" rx="6" fill="rgba(167, 139, 250, 0.2)" stroke="#7c3aed" stroke-width="1.5"/>
      <text class="p-label" x="384" y="52" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#111827">
        <tspan x="384" y="52">John</tspan>
      </text>
    </g>
  </g>
  <g class="annotations">
    <rect class="mask" x="40" y="108" width="125" height="23" rx="3" fill="#ffffff"/>
    <text class="frame-label" x="102" y="123" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11" font-weight="600" fill="#111827">
      <tspan x="102" y="123">par Alice to Bob</tspan>
    </text>
    <path class="section-divider" d="M32 207 L448 207" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 4"/>
    <rect class="mask" x="40" y="215" width="105" height="23" rx="3" fill="#ffffff"/>
    <text class="section-label" x="92" y="230" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#111827">
      <tspan x="92" y="230">Alice to John</tspan>
    </text>
  </g>
</svg>
