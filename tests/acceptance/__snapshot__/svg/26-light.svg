<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 403 319" width="403" height="319" role="img" data-diagram="sequence">
  <title>Sequence diagram</title>
  <desc>Sequence diagram with 2 participants (Alice, John) and 2 messages.</desc>
  <defs>
    <marker id="head-0-end" viewBox="-10 -5 15 10" refX="0" refY="0" markerWidth="15" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M-9,-4 L0,0 L-9,4" fill="none" stroke="#0891b2" stroke-width="1.4"/>
    </marker>
    <marker id="head-1-end" viewBox="-10 -5 15 10" refX="0" refY="0" markerWidth="15" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M-9,-4 L0,0 L-9,4" fill="none" stroke="#64748b" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="403" height="319" rx="0" fill="#f4f5f7"/>
  <g class="bands">
    <rect class="band-mask" x="32" y="148" width="339" height="111" rx="6" fill="#f4f5f7"/>
    <rect class="frame" x="32" y="148" width="339" height="111" rx="6" fill="rgba(148, 163, 184, 0.18)" stroke="#64748b" stroke-width="1.5"/>
  </g>
  <g class="lifelines">
    <path class="lifeline" d="M96 72 V287" fill="none" stroke="#64748b" stroke-width="0.8" stroke-dasharray="3 7"/>
    <path class="lifeline" d="M307 72 V287" fill="none" stroke="#64748b" stroke-width="0.8" stroke-dasharray="3 7"/>
  </g>
  <g class="activations"/>
  <g class="messages">
    <g class="message f-frontend" data-index="0" data-from="Alice" data-to="John" data-sender-head="none" data-receiver-head="open">
      <path class="m-line" d="M103 127 L300 127" fill="none" stroke="#0891b2" stroke-width="1.4" marker-end="url(#head-0-end)"/>
      <rect class="mask" x="112" y="100" width="179" height="23" rx="3" fill="#ffffff"/>
      <text class="m-label" x="201" y="115" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#077995">
        <tspan x="201" y="115">Hello John, how are you?</tspan>
      </text>
    </g>
    <g class="message f-external" data-index="1" data-from="John" data-to="Alice" data-sender-head="none" data-receiver-head="open">
      <path class="m-line" d="M300 218 L103 218" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#head-1-end)"/>
      <rect class="mask" x="173" y="191" width="57" height="23" rx="3" fill="#ffffff"/>
      <text class="m-label" x="201" y="206" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#606f85">
        <tspan x="201" y="206">Great!</tspan>
      </text>
    </g>
  </g>
  <g class="notes"/>
  <g class="participants">
    <g class="participant f-frontend" data-id="Alice">
      <rect class="mask" x="48" y="24" width="96" height="48" rx="6" fill="#ffffff"/>
      <rect class="box" x="48" y="24" width="96" height="48" rx="6" fill="rgba(34, 211, 238, 0.15)" stroke="#0891b2" stroke-width="1.5"/>
      <text class="p-label" x="96" y="52" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#111827">
        <tspan x="96" y="52">Alice</tspan>
      </text>
    </g>
    <g class="participant f-backend" data-id="John">
      <rect class="mask" x="259" y="24" width="96" height="48" rx="6" fill="#ffffff"/>
      <rect class="box" x="259" y="24" width="96" height="48" rx="6" fill="rgba(52, 211, 153, 0.18)" stroke="#059669" stroke-width="1.5"/>
      <text class="p-label" x="307" y="52" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#111827">
        <tspan x="307" y="52">John</tspan>
      </text>
    </g>
  </g>
  <g class="annotations">
    <rect class="mask" x="40" y="156" width="132" height="23" rx="3" fill="#ffffff"/>
    <text class="frame-label" x="106" y="171" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11" font-weight="600" fill="#111827">
      <tspan x="106" y="171">loop Every minute</tspan>
    </text>
  </g>
</svg>
