<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 240" width="344" height="240" role="img" data-diagram="sequence">
  <title>Sequence diagram</title>
  <desc>Sequence diagram with 2 participants (Alice, Bob) and 2 messages.</desc>
  <defs>
    <marker id="head-0-end" viewBox="-10 -5 15 10" refX="0" refY="0" markerWidth="15" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M-9,-4 L0,0 L-9,4 z" fill="#a78bfa" stroke="#a78bfa" stroke-width="1.4"/>
    </marker>
    <marker id="head-1-end" viewBox="-10 -5 15 10" refX="0" refY="0" markerWidth="15" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M-9,-4 L0,0 L-9,4 z" fill="#22d3ee" stroke="#22d3ee" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="344" height="240" rx="0" fill="#020617"/>
  <g class="bands"/>
  <g class="lifelines">
    <path class="lifeline" d="M80 72 V208" fill="none" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3 7"/>
    <path class="lifeline" d="M264 72 V208" fill="none" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3 7"/>
  </g>
  <g class="activations"/>
  <g class="messages">
    <g class="message f-database" data-index="0" data-from="Alice" data-to="Bob" data-sender-head="none" data-receiver-head="arrow">
      <path class="m-line" d="M87 127 L257 127" fill="none" stroke="#a78bfa" stroke-width="1.4" marker-end="url(#head-0-end)"/>
      <rect class="mask" x="100" y="100" width="145" height="23" rx="3" fill="#0f172a"/>
      <text class="m-label" x="172" y="115" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#a78bfa">
        <tspan x="172" y="115">Collections request</tspan>
      </text>
    </g>
    <g class="message f-frontend" data-index="1" data-from="Bob" data-to="Alice" data-sender-head="none" data-receiver-head="arrow">
      <path class="m-line" d="M257 175 L87 175" fill="none" stroke="#22d3ee" stroke-width="1.4" marker-end="url(#head-1-end)"/>
      <rect class="mask" x="96" y="148" width="152" height="23" rx="3" fill="#0f172a"/>
      <text class="m-label" x="172" y="163" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#22d3ee">
        <tspan x="172" y="163">Collections response</tspan>
      </text>
    </g>
  </g>
  <g class="notes"/>
  <g class="participants">
    <g class="participant f-database" data-id="Alice">
      <rect class="mask" x="32" y="24" width="96" height="48" rx="6" fill="#0f172a"/>
      <rect class="box" x="32" y="24" width="96" height="48" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
      <text class="p-label" x="80" y="52" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#ffffff">
        <tspan x="80" y="52">Alice</tspan>
      </text>
    </g>
    <g class="participant f-frontend" data-id="Bob">
      <rect class="mask" x="216" y="24" width="96" height="48" rx="6" fill="#0f172a"/>
      <rect class="box" x="216" y="24" width="96" height="48" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
      <text class="p-label" x="264" y="52" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#ffffff">
        <tspan x="264" y="52">Bob</tspan>
      </text>
    </g>
  </g>
  <g class="annotations"/>
</svg>
