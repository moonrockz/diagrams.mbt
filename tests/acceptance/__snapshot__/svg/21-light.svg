<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 378 336" width="378" height="336" role="img" data-diagram="sequence">
  <title>Sequence diagram</title>
  <desc>Sequence diagram with 2 participants (Alice, John) and 4 messages.</desc>
  <defs>
    <marker id="head-0-end" viewBox="-10 -5 15 10" refX="0" refY="0" markerWidth="15" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M-9,-4 L0,0 L-9,4 z" fill="#0891b2" stroke="#0891b2" stroke-width="1.4"/>
    </marker>
    <marker id="head-1-end" viewBox="-10 -5 15 10" refX="0" refY="0" markerWidth="15" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M-9,-4 L0,0 L-9,4 z" fill="#0891b2" stroke="#0891b2" stroke-width="1.4"/>
    </marker>
    <marker id="head-2-end" viewBox="-10 -5 15 10" refX="0" refY="0" markerWidth="15" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M-9,-4 L0,0 L-9,4 z" fill="#64748b" stroke="#64748b" stroke-width="1.4"/>
    </marker>
    <marker id="head-3-end" viewBox="-10 -5 15 10" refX="0" refY="0" markerWidth="15" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M-9,-4 L0,0 L-9,4 z" fill="#64748b" stroke="#64748b" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="378" height="336" rx="0" fill="#f4f5f7"/>
  <g class="bands"/>
  <g class="lifelines">
    <path class="lifeline" d="M80 72 V304" fill="none" stroke="#64748b" stroke-width="0.8" stroke-dasharray="3 7"/>
    <path class="lifeline" d="M298 72 V304" fill="none" stroke="#64748b" stroke-width="0.8" stroke-dasharray="3 7"/>
  </g>
  <g class="activations">
    <rect class="activation-mask" x="297" y="175" width="10" height="48" rx="0" fill="#ffffff"/>
    <rect class="activation" x="297" y="175" width="10" height="48" rx="0" fill="rgba(52, 211, 153, 0.18)" stroke="#059669" stroke-width="1.5"/>
    <rect class="activation-mask" x="293" y="127" width="10" height="144" rx="0" fill="#ffffff"/>
    <rect class="activation" x="293" y="127" width="10" height="144" rx="0" fill="rgba(52, 211, 153, 0.18)" stroke="#059669" stroke-width="1.5"/>
  </g>
  <g class="messages">
    <g class="message f-frontend" data-index="0" data-from="Alice" data-to="John" data-sender-head="none" data-receiver-head="arrow">
      <path class="m-line" d="M87 127 L291 127" fill="none" stroke="#0891b2" stroke-width="1.4" marker-end="url(#head-0-end)"/>
      <rect class="mask" x="100" y="100" width="179" height="23" rx="3" fill="#ffffff"/>
      <text class="m-label" x="189" y="115" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#077995">
        <tspan x="189" y="115">Hello John, how are you?</tspan>
      </text>
    </g>
    <g class="message f-frontend" data-index="1" data-from="Alice" data-to="John" data-sender-head="none" data-receiver-head="arrow">
      <path class="m-line" d="M87 175 L293 175" fill="none" stroke="#0891b2" stroke-width="1.4" marker-end="url(#head-1-end)"/>
      <rect class="mask" x="107" y="148" width="165" height="23" rx="3" fill="#ffffff"/>
      <text class="m-label" x="189" y="163" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#077995">
        <tspan x="189" y="163">John, can you hear me?</tspan>
      </text>
    </g>
    <g class="message f-external" data-index="2" data-from="John" data-to="Alice" data-sender-head="none" data-receiver-head="arrow">
      <path class="m-line" d="M297 223 L87 223" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#head-2-end)"/>
      <rect class="mask" x="96" y="196" width="186" height="23" rx="3" fill="#ffffff"/>
      <text class="m-label" x="189" y="211" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#606f85">
        <tspan x="189" y="211">Hi Alice, I can hear you!</tspan>
      </text>
    </g>
    <g class="message f-external" data-index="3" data-from="John" data-to="Alice" data-sender-head="none" data-receiver-head="arrow">
      <path class="m-line" d="M293 271 L87 271" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#head-3-end)"/>
      <rect class="mask" x="137" y="244" width="105" height="23" rx="3" fill="#ffffff"/>
      <text class="m-label" x="189" y="259" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#606f85">
        <tspan x="189" y="259">I feel great!</tspan>
      </text>
    </g>
  </g>
  <g class="notes"/>
  <g class="participants">
    <g class="participant f-frontend" data-id="Alice">
      <rect class="mask" x="32" y="24" width="96" height="48" rx="6" fill="#ffffff"/>
      <rect class="box" x="32" y="24" width="96" height="48" rx="6" fill="rgba(34, 211, 238, 0.15)" stroke="#0891b2" stroke-width="1.5"/>
      <text class="p-label" x="80" y="52" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#111827">
        <tspan x="80" y="52">Alice</tspan>
      </text>
    </g>
    <g class="participant f-backend" data-id="John">
      <rect class="mask" x="250" y="24" width="96" height="48" rx="6" fill="#ffffff"/>
      <rect class="box" x="250" y="24" width="96" height="48" rx="6" fill="rgba(52, 211, 153, 0.18)" stroke="#059669" stroke-width="1.5"/>
      <text class="p-label" x="298" y="52" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#111827">
        <tspan x="298" y="52">John</tspan>
      </text>
    </g>
  </g>
  <g class="annotations"/>
</svg>
