<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 354 240" width="354" height="240" role="img" data-diagram="sequence">
  <title>Sequence diagram</title>
  <desc>Sequence diagram with 2 participants (API, DB) and 2 messages.</desc>
  <defs>
    <marker id="head-0-end" viewBox="-10 -5 15 10" refX="0" refY="0" markerWidth="15" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M-9,-4 L0,0 L-9,4 z" fill="#e11d48" stroke="#e11d48" stroke-width="1.4"/>
    </marker>
    <marker id="head-1-end" viewBox="-10 -5 15 10" refX="0" refY="0" markerWidth="15" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M-9,-4 L0,0 L-9,4 z" fill="#64748b" stroke="#64748b" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="354" height="240" rx="0" fill="#f4f5f7"/>
  <g class="bands"/>
  <g class="lifelines">
    <path class="lifeline" d="M96 72 V208" fill="none" stroke="#64748b" stroke-width="0.8" stroke-dasharray="3 7"/>
    <path class="lifeline" d="M265 72 V208" fill="none" stroke="#64748b" stroke-width="0.8" stroke-dasharray="3 7"/>
  </g>
  <g class="activations"/>
  <g class="messages">
    <g class="message f-security" data-index="0" data-from="API" data-to="DB" data-sender-head="none" data-receiver-head="arrow">
      <path class="m-line" d="M103 127 L258 127" fill="none" stroke="#e11d48" stroke-width="1.4" marker-end="url(#head-0-end)"/>
      <rect class="mask" x="155" y="100" width="50" height="23" rx="3" fill="#ffffff"/>
      <text class="m-label" x="180" y="115" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#d81c45">
        <tspan x="180" y="115">Query</tspan>
      </text>
    </g>
    <g class="message f-external" data-index="1" data-from="DB" data-to="API" data-sender-head="none" data-receiver-head="arrow">
      <path class="m-line" d="M258 175 L103 175" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#head-1-end)"/>
      <rect class="mask" x="152" y="148" width="57" height="23" rx="3" fill="#ffffff"/>
      <text class="m-label" x="180" y="163" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#606f85">
        <tspan x="180" y="163">Result</tspan>
      </text>
    </g>
  </g>
  <g class="notes"/>
  <g class="participants">
    <g class="participant f-security" data-id="API">
      <rect class="mask" x="32" y="24" width="129" height="48" rx="6" fill="#ffffff"/>
      <rect class="box" x="32" y="24" width="129" height="48" rx="6" fill="rgba(251, 113, 133, 0.15)" stroke="#e11d48" stroke-width="1.5"/>
      <text class="p-label" x="96" y="52" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#111827">
        <tspan x="96" y="52">External Name</tspan>
      </text>
    </g>
    <g class="participant f-database" data-id="DB">
      <rect class="mask" x="208" y="24" width="114" height="48" rx="6" fill="#ffffff"/>
      <rect class="box" x="208" y="24" width="114" height="48" rx="6" fill="rgba(167, 139, 250, 0.2)" stroke="#7c3aed" stroke-width="1.5"/>
      <text class="p-label" x="265" y="52" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#111827">
        <tspan x="265" y="52">External DB</tspan>
      </text>
    </g>
  </g>
  <g class="annotations"/>
</svg>
