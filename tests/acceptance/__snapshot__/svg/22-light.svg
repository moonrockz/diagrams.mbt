<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 249 203" width="249" height="203" role="img" data-diagram="sequence">
  <title>Sequence diagram</title>
  <desc>Sequence diagram with 1 participant (John) and 0 messages.</desc>
  <defs/>
  <rect class="bg" x="0" y="0" width="249" height="203" rx="0" fill="#f4f5f7"/>
  <g class="bands"/>
  <g class="lifelines">
    <path class="lifeline" d="M80 72 V171" fill="none" stroke="#64748b" stroke-width="0.8" stroke-dasharray="3 7"/>
  </g>
  <g class="activations"/>
  <g class="messages"/>
  <g class="notes">
    <rect class="note-mask" x="99" y="100" width="106" height="39" rx="4" fill="#ffffff"/>
    <rect class="note" x="99" y="100" width="106" height="39" rx="4" fill="rgba(148, 163, 184, 0.18)" stroke="#64748b" stroke-width="1.5"/>
    <text class="note-label" x="152" y="123" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#111827">
      <tspan x="152" y="123">Text in note</tspan>
    </text>
  </g>
  <g class="participants">
    <g class="participant f-frontend" data-id="John">
      <rect class="mask" x="32" y="24" width="96" height="48" rx="6" fill="#ffffff"/>
      <rect class="box" x="32" y="24" width="96" height="48" rx="6" fill="rgba(34, 211, 238, 0.15)" stroke="#0891b2" stroke-width="1.5"/>
      <text class="p-label" x="80" y="52" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#111827">
        <tspan x="80" y="52">John</tspan>
      </text>
    </g>
  </g>
  <g class="annotations"/>
</svg>
