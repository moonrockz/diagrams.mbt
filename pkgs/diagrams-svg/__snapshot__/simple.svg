    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="304" height="192" rx="0" fill="var(--bg)"/>
  <g class="bands"/>
  <g class="lifelines">
    <path class="lifeline" d="M80 72 V160" fill="none" stroke="var(--arrow)" stroke-width="0.8" stroke-dasharray="3 7"/>
