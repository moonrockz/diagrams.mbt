# Mise configuration for the moonrockz/diagrams.mbt monorepo.
#
# Tools are pinned here. Tasks are MoonBit scripts in scripts/*.mbtx, run with moonx, so one script
# works on every platform (see AGENTS.md).
#
# Local overrides go in .config/mise/config.local.toml (gitignored); see config.local.toml.example.

[tools]
# Node.js runs the js target in `moon test --target js` and `moon run --target js`.
node = "24.14.1"

# Bun installs the locked site browser test dependencies
bun = "1.4.3"

# Browser harness CLI for the docs site smoke test; must match apps/site/package.json and the Playwright
# version of the site build workflow.
"npm:@playwright/test" = "1.64.1"

# YAML linting, pinned so lint results do not change between machines
yamllint = "1.38.0"

# Git hooks manager; the hooks are in lefthook.yml
lefthook = "2.1.1"

# Spec-driven change proposals under openspec/; needs Node.js 20.19 or later
"npm:@fission-ai/openspec" = "1.14.1"

# C compiler used through the external moonrockz/zig-cross tool
zig = "0.17.0"

# MoonBit toolchain, pinned. mise cannot resolve "latest" for an http: tool, and a pinned version
# keeps CI and every machine on the same compiler. To move to a newer release, change the version
# here and in each URL (with "+" written as "%2B"), taken from
# https://cli.moonbitlang.com/binaries/<version>/.
#
# The binary archive omits the core library. CI (and a fresh machine) completes it with
# `curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOON_HOME=$(mise where http:moonbit) bash -s -- <version>`.

[tools."http:moonbit"]
version = "0.10.17+093cb8f9c"
bin_path = "bin"

[tools."http:moonbit".platforms]
linux-x64 = { url = "https://cli.moonbitlang.com/binaries/0.10.17%2B093cb8f9c/moonbit-linux-x86_64.tar.gz" }
linux-arm64 = { url = "https://cli.moonbitlang.com/binaries/0.10.17%2B093cb8f9c/moonbit-linux-aarch64.tar.gz" }
macos-arm64 = { url = "https://cli.moonbitlang.com/binaries/0.10.17%2B093cb8f9c/moonbit-darwin-aarch64.tar.gz" }
windows-x64 = { url = "https://cli.moonbitlang.com/binaries/0.10.17%2B093cb8f9c/moonbit-windows-x86_64.zip", format = "zip" }
# No Windows arm64 build is published; Windows on Arm runs the x64 build under emulation.
windows-arm64 = { url = "https://cli.moonbitlang.com/binaries/0.10.17%2B093cb8f9c/moonbit-windows-x86_64.zip", format = "zip" }

[env]
_.path = ["./node_modules/.bin"]

# Every task is a MoonBit script: `moonx scripts/<name>.mbtx`. Pass arguments after `--`.

[tasks.build]
description = "Build all workspace members (args: targets, --release; default: wasm wasm-gc js native)"
run = "moonx scripts/build.mbtx"

[tasks."build:wasm"]
description = "Build all workspace members for the wasm target"
run = "moonx scripts/build.mbtx wasm"

[tasks."build:wasm-gc"]
description = "Build all workspace members for the wasm-gc target"
run = "moonx scripts/build.mbtx wasm-gc"

[tasks."build:js"]
description = "Build all workspace members for the js target"
run = "moonx scripts/build.mbtx js"

[tasks."build:native"]
description = "Build all workspace members for native in release mode"
run = "moonx scripts/build.mbtx native --release"

[tasks."build:site"]
description = "Build the docs site into _site/ (args: --main, --tree next|<minor>)"
run = "moonx scripts/site.mbtx build"

[tasks."check:site"]
description = "Check the built docs site in _site/, tree by tree when it is assembled (args: --tree next|<minor>)"
run = "moonx scripts/site.mbtx check"

[tasks."test:site"]
description = "Test the thin site consumer and run the browser smoke test on _site/ (args: --tree next|<minor>)"
run = "moonx scripts/site.mbtx test"

[tasks."assemble:site"]
description = "Add the release trees to the next build in _site/ and write the versioned site (needs gh; CI deploy)"
run = "moonx scripts/site.mbtx assemble"

[tasks."dev:site"]
description = "Build the docs site, serve it at http://127.0.0.1:4173/diagrams.mbt/ and build again on change (args: --port <n>, --no-watch)"
depends = ["build:site"]
run = "moonx scripts/serve-site.mbtx"

[tasks.test]
description = "Run tests for all workspace members (args: targets; default: wasm wasm-gc js native)"
run = "moonx scripts/test.mbtx"

[tasks.format]
description = "Format MoonBit code"
run = "moonx scripts/format.mbtx"

[tasks.lint]
description = "Run all lint tasks (YAML, MoonBit format and check)"
run = "moonx scripts/lint.mbtx"

[tasks."lint:moonbit"]
description = "Check MoonBit formatting and run moon check"
run = "moonx scripts/lint-moonbit.mbtx"

[tasks."lint:yaml"]
description = "Lint YAML files with yamllint"
run = "moonx scripts/lint-yaml.mbtx"

[tasks.validate]
description = "Run all validation checks"
depends = ["validate:packages", "validate:versions", "validate:corpus", "validate:swimlane-corpus", "validate:bpmn-corpus", "validate:bpmn-schema", "validate:animation-assets", "validate:examples", "validate:plantuml-corpus", "validate:icons", "validate:native-mermaid-corpus"]

[tasks."validate:packages"]
description = "Verify the workspace package structure against moon.work"
run = "moonx scripts/validate-packages.mbtx"

[tasks."validate:versions"]
description = "Verify that every module and version string has the version of the root moon.mod"
run = "moonx scripts/versions.mbtx check"

[tasks."validate:corpus"]
description = "Check the digests of the frozen Mermaid corpus and that its generated MoonBit file is current"
run = "moonx scripts/corpus.mbtx check"

[tasks."corpus:generate"]
description = "Write tests/corpus/examples.generated.mbt from the frozen Mermaid corpus"
run = "moonx scripts/corpus.mbtx generate"

[tasks."corpus:reference"]
description = "Refresh sequence reference fixtures with moonbit-community/mermaid@0.2.0"
run = "moonx scripts/sequence-fixtures.mbtx"

[tasks."test:svg"]
description = "Verify standalone SVG snapshots and adaptive themes in Chromium"
run = "moonx scripts/test-svg.mbtx"

[tasks.gallery]
description = "Verify snapshots and write the sequence/BPMN/XML/player review gallery"
run = "moonx scripts/gallery.mbtx"

[tasks."test:native-zig"]
description = "Run native tests with zig as the C compiler"
run = "moonx moonrockz/zig-cross@0.1.2 exec host -- moonx scripts/test.mbtx native"

[tasks."test:scripts"]
description = "Test the task scripts"
run = "moonx scripts/test-scripts.mbtx"

[tasks.check]
description = "Run lint, validate, tests, task script tests and builds"
run = "moonx scripts/check.mbtx"

[tasks."release:plan"]
description = "Decide whether a Release workflow run releases (CI)"
run = "moonx scripts/release.mbtx plan"

[tasks."release:credentials"]
description = "Write mooncakes.io credentials from MOONCAKES_USER_TOKEN (CI only)"
run = "moonx scripts/credentials.mbtx"

[tasks."release:publish"]
description = "Publish the public modules to mooncakes.io; already published versions count as done (CI only)"
run = "moonx scripts/publish.mbtx"

[tasks."release:notes"]
description = "Print the CHANGELOG.md section of a version (args: X.Y.Z)"
run = "moonx scripts/release.mbtx notes"

[tasks."release:github"]
description = "Create the GitHub release vX.Y.Z unless it exists (args: X.Y.Z NOTES_FILE; CI only)"
run = "moonx scripts/release.mbtx github"

[tasks.clean]
description = "Remove build artifacts"
run = "moonx scripts/clean.mbtx"

[tasks."hooks:install"]
description = "Install git hooks with lefthook"
run = "moonx scripts/hooks-install.mbtx"

[tasks."openspec:setup"]
description = "Refresh OpenSpec skills and commands for Codex, Claude, Grok, Cursor and Copilot"
run = "moonx scripts/openspec-setup.mbtx"

[tasks.list-tasks]
description = "List mise tasks"
run = "mise tasks"

[settings]
experimental = true

[tasks."validate:bpmn-corpus"]
description = "Check frozen BPMN schema/fixture digests and embedded test inputs"
run = "moonx scripts/bpmn-corpus.mbtx check"

[tasks."bpmn-corpus:generate"]
description = "Embed frozen BPMN schemas and the minimal fixture for portable tests"
run = "moonx scripts/bpmn-corpus.mbtx generate"

[tasks."bpmn-schema:generate"]
description = "Generate BPMN types and declaration coverage from pinned schemas"
run = "moonx scripts/bpmn-schema.mbtx generate"

[tasks."validate:bpmn-schema"]
description = "Check pinned schema metadata and declaration coverage regeneration"
run = "moonx scripts/bpmn-schema.mbtx check"

[tasks."bpmn-corpus:reference"]
description = "Refresh semantic BPMN fixtures with test-only pinned bpmn-moddle"
run = "moonx scripts/bpmn-reference.mbtx"

[tasks."animation-assets:generate"]
description = "Embed trusted standalone animation player assets"
run = "moonx scripts/animation-assets.mbtx generate"

[tasks."validate:animation-assets"]
description = "Check reproducible standalone player asset embedding"
run = "moonx scripts/animation-assets.mbtx check"

[tasks."test:animation"]
description = "Qualify stored standalone animation artifacts in Chromium without rebuilding the workspace/site"
run = "moonx scripts/test-animation.mbtx"

[tasks."validate:examples"]
description = "Check generated site examples against stored canonical/HTML snapshots"
run = "moonx scripts/gallery.mbtx --existing-output --site-assets --site-assets-only --check"

[tasks."test:bpmn-consumer"]
description = "Qualify a fresh reader-only BPMN consumer on all four targets"
run = "moonx scripts/test-bpmn-consumer.mbtx"

[tasks."validate:swimlane-corpus"]
description = "Check pinned Mermaid swimlane source digests and portable oracle fixtures"
run = "moonx scripts/swimlane-corpus.mbtx check"

[tasks."swimlane-corpus:generate"]
description = "Embed frozen Mermaid swimlane reference fixtures for portable tests"
run = "moonx scripts/swimlane-corpus.mbtx generate"

[tasks."swimlane-corpus:reference"]
description = "Qualify native swimlanes against locked test-only Mermaid 12.2.0 in Chromium"
run = "moonx scripts/swimlane-reference.mbtx"

[tasks."validate:plantuml-corpus"]
description = "Check pinned PlantUML 1.2026.9 fixture digests, the reference report binding and the portable embedding"
run = "moonx scripts/plantuml-corpus.mbtx check"

[tasks."plantuml-corpus:generate"]
description = "Embed the frozen PlantUML fixtures and reference for portable tests"
run = "moonx scripts/plantuml-corpus.mbtx generate"

[tasks."plantuml-corpus:reference"]
description = "Refresh (or with -- --check, verify) the PlantUML reference with the pinned test-only JAR and JDK"
tools = { java = "temurin-21.0.13+9.0.LTS" }
run = "moonx scripts/plantuml-reference.mbtx"

[tasks."test:plantuml-consumer"]
description = "Qualify fresh model-only, PlantUML-reader and external-provider consumers on all four targets"
run = "moonx scripts/test-plantuml-consumer.mbtx"

[tasks."icons:generate"]
description = "Compile the frozen full annotator catalog into portable typed vector values"
run = "moonx scripts/icon-catalog.mbtx generate"

[tasks."validate:icons"]
description = "Check all 523 icon asset digests and deterministic catalog generation"
run = "moonx scripts/icon-catalog.mbtx check"

[tasks."native-mermaid-corpus:generate"]
description = "Embed independent ZenUML and architecture semantic reference fixtures"
run = "moonx scripts/native-mermaid-corpus.mbtx generate"

[tasks."validate:native-mermaid-corpus"]
description = "Check pinned ZenUML/architecture sources, digests, oracles and portable embeddings"
run = "moonx scripts/native-mermaid-corpus.mbtx check"

[tasks."native-mermaid-corpus:reference"]
description = "Repeat exact pinned test-only ZenUML/architecture oracles and canonical upstream parsing"
run = "moonx scripts/native-mermaid-reference.mbtx"

[tasks."check:site-compatibility"]
description = "Compare built public routes and heading anchors with the pre-Telescope baseline"
run = "moonx scripts/site-compatibility.mbtx"

[tasks."test:site-consumer"]
description = "Qualify released Telescope root/next builds, legacy routes and exact gallery bytes (args: --existing-output)"
run = "moonx scripts/site-consumer.mbtx"
